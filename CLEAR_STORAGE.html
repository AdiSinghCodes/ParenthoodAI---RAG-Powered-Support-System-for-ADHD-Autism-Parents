<!DOCTYPE html>
<html>
<head>
    <title>Clear LocalStorage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #5568d3;
        }
        .success {
            color: #10b981;
            font-weight: bold;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Clear Storage</h1>
        <p>Click the button below to clear old authentication tokens</p>
        <button onclick="clearStorage()">Clear LocalStorage</button>
        <div class="success" id="success">✅ Storage cleared! You can close this tab.</div>
    </div>
    
    <script>
        function clearStorage() {
            localStorage.clear();
            document.getElementById('success').style.display = 'block';
            console.log('LocalStorage cleared successfully');
        }
    </script>
</body>
</html>
